<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9 9">
  <!-- Black Plague's (and Requiem's) crosshair, player_crosshair_cross
       (9x9): a soft white dot, drawn centred on the screen's middle. Smaller
       than the original's (core about 3 pixels across, halo 5): a core 1.3
       pixels across with a faint halo, so it marks the centre without
       covering what is looked at. -->
  <defs>
    <radialGradient id="dot" cx="4.5" cy="4.5" r="1.6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="4.5" cy="4.5" r="1.6" fill="url(#dot)"/>
</svg>
