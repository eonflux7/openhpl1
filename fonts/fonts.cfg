<!--
	Vector fonts that replace the glyphs of the game's bitmap fonts. The game's
	.fnt files are still loaded: their line height and baseline are kept, and
	their bitmaps are used for characters a font file here lacks.

	Name:  the bitmap font the game asks for
	File:  the font file, in this directory
	Size:  the em size as a part of the bitmap font's line height
	Width: horizontal scale of the glyphs and their advances

	Size gives capital letters the height they have in the original bitmap
	font, and Width gives the game's English text the same length as with the
	original font, so text wraps at about the same places.
-->
<Fonts>
	<!-- original: Verdana -->
	<Font Name="verdana.fnt" File="Arimo-Regular.ttf" Size="0.885" Width="1.095" />
	<!-- original: Arial Narrow -->
	<Font Name="font_menu_small.fnt" File="Arimo-Regular.ttf" Size="0.872" Width="0.820" />
	<!-- original: Arial Bold -->
	<Font Name="font_menu_large.fnt" File="Arimo-Bold.ttf" Size="0.872" Width="0.949" />
	<!-- original: Century Gothic -->
	<Font Name="cour.fnt" File="Arimo-Regular.ttf" Size="0.770" Width="1.118" />
	<!-- original: Courier New -->
	<Font Name="font_computer.fnt" File="Cousine-Regular.ttf" Size="0.828" Width="1.098" />
	<!-- original: Verdana -->
	<Font Name="viewer.fnt" File="Arimo-Regular.ttf" Size="0.895" Width="1.101" />
</Fonts>
